<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" role="img" aria-labelledby="title desc">
<title id="title">Nirupom Bose Roy — Senior Technology Developer</title><desc id="desc">An animated distributed network on a midnight-blue grid. Distributed systems, backend engineering and applied AI.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#273f5a"/></linearGradient>
 <linearGradient id="accent"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#9ed8ed"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#7cafe8" stop-opacity=".22"/><stop offset="1" stop-color="#7cafe8" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#8db9ff" stroke-opacity=".035" fill="none"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1038" height="308" rx="24"/></clipPath>
</defs>
<style>
 .pulse{animation:pulse 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.p2{animation-delay:-1s}.p3{animation-delay:-2s}.flow{stroke-dasharray:5 28;animation:flow 5s linear infinite}.slow{animation-duration:7s}.blink{animation:blink 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.55;transform:scale(1.18)}}@keyframes flow{to{stroke-dashoffset:-66}}@keyframes blink{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.blink{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="1040" height="310" fill="url(#bg)"/><rect width="1040" height="310" fill="url(#grid)"/><ellipse cx="850" cy="145" rx="270" ry="230" fill="url(#glow)"/>
